
name: YMB Banking Backend CI

on:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install Flask==2.1.2 Flask-PyMongo==2.3.0 Werkzeug==2.1.2 pymongo==4.1.1 pytest mongomock

      - name: Run tests
        run: pytest test_banking.py
